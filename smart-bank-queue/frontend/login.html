
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartBank</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .login-card button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .login-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
    }

    .logo {
      text-align: center;
      font-size: 35px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <div class="logo">🏦</div>

      <h1>SmartBank</h1>
      <p class="subtitle">Bank Queue Management System</p>

      <form id="loginForm">

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit" id="loginButton">
          Login
        </button>

      </form>

      <p id="message"></p>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
