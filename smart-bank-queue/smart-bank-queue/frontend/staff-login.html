
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - SmartBank</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #edf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 340px;
            box-shadow: 0 5px 25px #0002;
        }

        h2 { text-align: center; color: #142c48; }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            box-sizing: border-box;
            border-radius: 7px;
        }

        input { border: 1px solid #ccc; }

        button {
            background: #2165e8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #message { color: red; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Staff Login</h2>
        <p>Smart Bank Queue Management</p>

        <form id="staffLoginForm">
            <input type="email" id="email"
                   placeholder="Staff Email" required>

            <input type="password" id="password"
                   placeholder="Password" required>

            <button type="submit" id="loginButton">
                Staff Login
            </button>
        </form>

        <p id="message"></p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/staff-login.js"></script>
</body>
</html>
