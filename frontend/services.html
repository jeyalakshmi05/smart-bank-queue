<!DOCTYPE html>
<html>
<head>
  <title>Services - SmartBank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><a href="index.html" class="logo">🏦 SmartBank</a><nav><a href="admin.html">Admin</a><a href="services.html">Services</a><a href="counters.html">Counters</a></nav></header>
<main class="container">
  <div class="page-title"><div><h1>Service Management</h1><p>CRUD operations for bank services.</p></div></div>
  <div class="card form-card">
    <h2 id="formTitle">Add Service</h2>
    <input id="serviceId" type="hidden">
    <label>Service Name</label><input id="serviceName" placeholder="e.g. Cash Withdrawal">
    <label>Token Prefix</label><input id="prefix" maxlength="2" placeholder="A">
    <label>Average Service Time (minutes)</label><input id="averageTime" type="number" min="1" value="5">
    <button onclick="saveService()">Save Service</button>
  </div>
  <div class="card"><h2>Services</h2><div id="serviceTable" class="table-wrap"></div></div>
</main>
<script src="js/api.js"></script>
<script src="js/services.js"></script>
</body>
</html>
